[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-delegate"
version = "0.6.0"
description = "Local stdio MCP bridge for Grok CLI delegation (worktrees, ACP transports, receipts)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aleksandr / zai-one" },
]
keywords = ["mcp", "grok", "cli", "agent", "stdio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
grok-delegate = "grok_delegate.server:main"

[tool.setuptools.packages.find]
include = ["grok_delegate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
