[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-delegate"
version = "0.14.0"
description = "MCP bridge that hands the coding loop to Grok CLI and returns a verified, bounded receipt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aleksandr / zai-one" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "grok",
    "claude-code",
    "codex",
    "cursor",
    "agent",
    "delegation",
    "token-economy",
    "stdio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://zai.one"
Repository = "https://github.com/zai-one/grok-mcp"
Issues = "https://github.com/zai-one/grok-mcp/issues"
Changelog = "https://github.com/zai-one/grok-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# jsonschema is what makes tests/test_tool_schemas.py actually validate the
# tool schemas; without it that guard skips silently, which is the same as
# not having it. Declared here so `pip install -e .[test]` runs the real check.
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
grok-delegate = "grok_delegate.server:main"

[tool.setuptools.packages.find]
include = ["grok_delegate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
