name: MCP engineering standard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_engineering.py --check
