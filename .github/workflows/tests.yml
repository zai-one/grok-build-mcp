name: tests

# The suite is the project's own argument: it claims a receipt can be trusted
# because the bridge verifies rather than believes. Running it in the open is
# the same claim applied to itself. No Grok CLI and no network are needed --
# every test mocks the transport.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Git identity
        # Tests build throwaway repositories and commit into them. A runner has
        # no global identity, and `git commit` without one fails before the
        # assertion it was meant to reach.
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Suite
        run: python -m pytest tests -q
